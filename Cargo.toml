[package]
name = "unrun"
version = "0.1.0"
edition = "2024"
description = "Undo what a command did to your project folder"
license = "MIT"

[dependencies]
anyhow = "1"
# "pure" avoids the C/asm backends, so no C compiler is needed to build.
blake3 = { version = "1", features = ["pure"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
